<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">tierra</title>
  <desc id="d">La Tierra y el sistema solar en WebGL, con shaders propios de atmósfera y nubes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02040c"/><stop offset="0.55" stop-color="#050a1a"/><stop offset="1" stop-color="#08112a"/></linearGradient>
    <radialGradient id="earth" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#5ec9ff"/><stop offset="0.45" stop-color="#2f7fd6"/><stop offset="1" stop-color="#0e2f66"/></radialGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.85" stop-color="#7fd4ff" stop-opacity="0"/><stop offset="1" stop-color="#7fd4ff" stop-opacity="0.55"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7fd4ff" stop-opacity="0.16"/><stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>

  <!-- estrellas -->
  <g fill="#ffffff">
    <circle cx="90" cy="40" r="1.3" opacity="0.8"/><circle cx="180" cy="90" r="1" opacity="0.5"/>
    <circle cx="260" cy="30" r="1.4" opacity="0.7"/><circle cx="340" cy="70" r="1" opacity="0.4"/>
    <circle cx="120" cy="220" r="1.2" opacity="0.6"/><circle cx="60" cy="150" r="1" opacity="0.5"/>
    <circle cx="420" cy="40" r="1.1" opacity="0.6"/><circle cx="500" cy="200" r="1.3" opacity="0.5"/>
    <circle cx="600" cy="60" r="1" opacity="0.4"/><circle cx="1150" cy="50" r="1.3" opacity="0.7"/>
    <circle cx="1100" cy="240" r="1" opacity="0.5"/><circle cx="1050" cy="90" r="1.2" opacity="0.6"/>
  </g>

  <ellipse cx="940" cy="150" rx="260" ry="260" fill="url(#glow)"/>
  <circle cx="940" cy="150" r="150" fill="url(#atmo)"/>
  <circle cx="940" cy="150" r="128" fill="url(#earth)"/>
  <path d="M 860 90 Q 900 100 890 130 Q 920 120 940 150 Q 900 170 880 200 Q 850 190 860 150 Z" fill="#1c9d5b" opacity="0.55"/>
  <path d="M 970 190 Q 1010 195 1005 220 Q 980 225 970 210 Z" fill="#1c9d5b" opacity="0.5"/>
  <ellipse cx="900" cy="110" rx="60" ry="18" fill="#ffffff" opacity="0.18"/>
  <ellipse cx="990" cy="180" rx="70" ry="16" fill="#ffffff" opacity="0.14"/>

  <text x="62" y="128" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#eaf6ff">tierra</text>
  <text x="66" y="168" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#8fc9ff">WebGL · Three.js · shaders propios</text>
  <text x="66" y="200" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#9fb3d0">La Tierra y el sistema solar, renderizados en el navegador</text>

  <rect x="64" y="228" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/><text x="129.0" y="249" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#eaf6ff">Sin build</text>
  <rect x="202" y="228" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/><text x="272.0" y="249" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#eaf6ff">ES Modules</text>
  <rect x="350" y="228" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/><text x="425.0" y="249" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#eaf6ff">Bloom / PBR</text>
